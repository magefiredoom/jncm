# CPU smoke config for JEPA joint mode (SPEC section 8, TASKS T5.4). Same
# tokenizer and generator sizes as configs/smoke.yaml; only the quantizer, the
# head and the jepa block differ.
#
# generator.head must be "regress" or "flow"; the generator's "ce" head is
# rejected in JEPA mode (jncm/train_jepa.py:validate_jepa_config), and
# tokenizer.quantizer must stay "noisy" for the same reason. This smoke config
# uses "regress" because a flow step integrates the flow inside the VICReg
# c-hat term (Q11) and is the slower of the two on CPU.
L: 32
V: 64
seed: 42
device: "cpu"
compile: false

tokenizer:
  d: 64
  K: 4
  quantizer: "noisy"
  V_k: 64
  d_code: 16
  d_k: 8
  sigma_k: 0.4
  beta: 0.25
  ema_decay: 0.99
  dead_code_reinit_steps: 200
  dead_code_threshold: 0.0001
  encoder_blocks: 0
  decoder_blocks: 1
  decoder_heads: 4
  p_drop: 0.5

generator:
  H: 128
  n_layers: 2
  n_heads: 4
  mlp_ratio: 4.0
  dropout: 0.1
  head: "regress"
  flow_steps: 8
  n_rep: 4
  renorm_pred: true
  add_channel_noise: true
  regress_cosine: false
  alpha: 0.0
  corrupt:
    mode: "none"
    p_first: 0.8
    p_last: 0.2
    s_first: 0.5
    s_last: 0.1
  train:
    lr: 0.0003
    min_lr: 0.00003
    betas: [0.9, 0.95]
    weight_decay: 0.1
    warmup_steps: 20
    max_steps: 200
    grad_clip: 1.0
    batch_size: 16
    # T5.5a F13: equal micro-batches per optimizer step (losses are averaged);
    # VICReg statistics are computed per micro-batch.
    grad_accum: 1
    eval_every: 50
    save_every: 100
    save_milestones: true
    milestones: [0.10, 0.25, 0.50, 1.0]

jepa:
  enabled: true
  vicreg: true
  decoder_through_E: true
  ema: true
  target_chain: "online"
  lambda_var: 1.0
  lambda_cov: 0.04
  lambda_pred: 1.0
  gamma: 1.0
  m_start: 0.996
  m_end: 1.0

train:
  lr: 0.0005
  min_lr: 0.00005
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 1000
  grad_clip: 1.0
  batch_size: 16
  eval_every: 50
  save_every: 500
  allow_synthetic_data: true

eval:
  n_samples: 16
  n_seeds: 2
  gpt2_model_path: "models/gpt2-large"
