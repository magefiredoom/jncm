L: 128
V: 8192
seed: 42
device: "cuda"
compile: false

tokenizer:
  d: 384
  K: 12
  quantizer: "vq"
  V_k: 4096
  d_code: 64
  d_k: 8
  sigma_k: 0.4
  beta: 0.25
  ema_decay: 0.99
  dead_code_reinit_steps: 200
  dead_code_threshold: 0.0001
  encoder_blocks: 0
  decoder_blocks: 1
  decoder_heads: 6
  p_drop: 0.5

generator:
  H: 768
  n_layers: 12
  n_heads: 12
  mlp_ratio: 4.0
  dropout: 0.1
  head: "ce"
  flow_steps: 8
  n_rep: 4
  renorm_pred: true
  add_channel_noise: true
  alpha: 0.0
  corrupt:
    mode: "swap"
    p_first: 0.8
    p_last: 0.2
    s_first: 0.5
    s_last: 0.1

jepa:
  enabled: false
  vicreg: true
  decoder_through_E: true
  ema: true
  lambda_var: 1.0
  lambda_cov: 0.04
  lambda_pred: 1.0
  gamma: 1.0
  m_start: 0.996
  m_end: 1.0

train:
  lr: 0.0005
  min_lr: 0.00005
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 40000
  grad_clip: 1.0
  batch_size: 512
  eval_every: 500
  save_every: 5000
  allow_synthetic_data: false

eval:
  n_samples: 256
  n_seeds: 5
  gpt2_model_path: "models/gpt2-large"